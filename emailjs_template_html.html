<div style="font-family: system-ui, sans-serif, Arial; font-size: 12px">
<div>A message by {{name}} has been received. Kindly respond at your earliest convenience.</div>

<div style="margin-top: 20px; padding: 10px 0; border-top-width: 1px; border-top-style: dashed; border-top-color: lightgrey"></div>

<table role="presentation" style="width: 100%; border-collapse: collapse;">
  <tr>
    <td style="vertical-align: top;">
      <div style="padding: 15px; margin: 10px 0; background-color: aliceblue; border-radius: 5px; font-size: 26px; text-align: center; role='img'">
        👤
      </div>
    </td>
  </tr>
  <tr>
    <td style="vertical-align: top;">
      <div style="padding: 10px; font-size: 20px; font-weight: bold; text-align: center;">
        {{name}}
      </div>
    </td>
  </tr>
  <tr>
    <td style="vertical-align: top;">
      <div style="padding: 5px; font-size: 14px; text-align: center; color: #666;">
        {{time}}
      </div>
    </td>
  </tr>
</table>

<div style="margin-top: 20px; padding: 10px 0; border-top-width: 1px; border-top-style: dashed; border-top-color: lightgrey"></div>

<div style="margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px; line-height: 1.6;">
  {{message}}
</div>

<div style="margin-top: 20px; padding: 10px; font-size: 11px; color: #999; text-align: center;">
  Contact Details:<br>
  Email: {{email}}<br>
  Phone: {{phone}}<br>
  Company: {{company}}<br>
  Product Interest: {{product_interest}}
</div>
</div>
